name: Deploy Relay Studio site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages base path
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER.github.io" ]; then
            echo "GITHUB_PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "GITHUB_PAGES_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Materialize deployment brand assets
        shell: bash
        run: |
          if [ -L public/brand ]; then
            unlink public/brand
          fi
          mkdir -p public/brand
          cp .github/brand/relay-icon-light.svg public/brand/relay-icon-light.svg
          cp .github/brand/relay-icon-dark.svg public/brand/relay-icon-dark.svg

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
